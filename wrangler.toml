name = "api-relay"
main = "src/index.ts"
compatibility_date = "2024-05-01"

[vars]
ADMIN_SECRET = "change-me-in-production"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

[[d1_databases]]
binding = "DB"
database_name = "relay-db"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "relay-storage"
